services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: garden
      POSTGRES_PASSWORD: garden_local_only
      POSTGRES_DB: garden
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - garden-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garden"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  garden-postgres:
